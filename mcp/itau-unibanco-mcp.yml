type: MCPServer
name: Itaú Unibanco MCP (candidate)
generated: '2026-10-18'
method: derived
source: openapi/ (8 Open Finance Brasil open-data specs) + web search 2026-10-18
status: candidate
deployment:
  mode: none
  auth: none
  verified: derived
official_server:
  found: false
  evidence: Web search 2026-10-18 found no Itaú-published MCP server; https://devportal.itau.com.br/.well-known/mcp.json
    returned 404; devportal.itau.com.br/mcp returns the SPA shell (200 for every path),
    not an MCP endpoint.
third_party:
- name: '@codespar/mcp-itau'
  official: false
  registry: npm
  url: https://www.npmjs.com/package/@codespar/mcp-itau
  version: 0.2.0-alpha.3
  published: '2026-06-22'
  transport: stdio
  install: npx -y @codespar/mcp-itau
  description: 'Community server by CodeSpar (not Itaú): Pix, Cobrança (boleto), Arrecadação,
    Extrato via Itaú Developer Portal APIs (OAuth2 + mTLS). Listed at https://www.getdrio.com/mcp/io-github-codespar-mcp-itau;
    tools not verified.'

apis:
- aid: itau-unibanco:corporate-apis
  name: Itaú for Developers Corporate APIs
  description: >-
    Itaú's corporate API catalog on Itaú for Developers: Pix receipts and payments, payment initiation,
    payroll-deductible credit (consignado), credit recovery, collateral lookup, treasury bank cash supply,
    third-party fund custody, and foreign exchange and trade. Per-API reference pages (devportal.itau.com.br/nossas-apis/<api>)
    require a portal login; the getting-started guide documents the call pattern https://api.itau.com.br/{api}/{versao}/{recurso}
    with OAuth2 client credentials from https://sts.itau.com.br/api/oauth/token and mTLS certificates.
    No machine-readable contract is publicly available.
  humanURL: https://devportal.itau.com.br/baas/#/catalog
  baseURL: https://api.itau.com.br/{api}/{versao}/{recurso}

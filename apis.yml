aid: itau-unibanco

name: Itaú Unibanco

description: Itaú Unibanco Holding S.A. (CNPJ 60.872.504/0001-23, São Paulo, Brazil) is Brazil's largest private bank, describing itself as the
  largest bank in Latin America. Through its developer portal, Itaú for Developers (devportal.itau.com.br), it offers companies APIs for Pix receipts
  and payments, payment initiation, payroll-deductible credit (consignado), credit recovery, collateral lookup, treasury bank cash supply, third-party
  fund custody, foreign exchange and trade, plus Open Finance and managed file transfer, with a sandbox environment, self-registration and getting-started
  guides covering credentials and dynamic certificates.


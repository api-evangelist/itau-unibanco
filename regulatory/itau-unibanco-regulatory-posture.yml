summary: >-
  Read from the Itaú Unibanco developer portal's own Privacy Policy (Política de
  Privacidade, "Atualização: agosto de 2020") under Brazil's LGPD (Lei nº 13.709/18).
  The policy lists LGPD data-subject rights, including portability and review of
  decisions made solely by automated processing. It says personal data may be
  transferred and processed abroad, and it ties retention to purpose without a fixed
  period. It names a DPO (Encarregado) contact. The developer Terms of Use
  (termos-de-uso) are API/sandbox licence terms and say nothing about these signals.
  Neither page addresses subprocessors (beyond a right to ask which entities data was
  shared with), incident notification to customers, accessibility, SBOM, GPC, AI
  transparency or a transparency report. The corporate site itau.com.br answered the
  pre-flight browser UA with HTTP 403 (bot challenge), so its privacy hub
  (www.itau.com.br/seguranca/privacidade, which the policy references) was not read.
